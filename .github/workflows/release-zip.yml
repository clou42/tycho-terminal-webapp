name: Build & Release App ZIP
on:
  push:
    branches: [ main ]
    paths:
      - 'tycho-terminal-webapp/**'
      - '.github/workflows/release-zip.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP_DIR: "."
      NODE_VERSION: "22"
      NPM_FLAGS: "--omit=dev"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install production dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci $NPM_FLAGS

      - name: Build flat ZIP (include node_modules)
        run: |
          cd "$APP_DIR"
          # Zip the *contents* so files are at ZIP root (no parent directory)
          zip -r ../tycho-terminal.zip . -x "**/.git*" "**/.github/**"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mv ../tycho-terminal.zip "$GITHUB_WORKSPACE/build/tycho-terminal.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_id }}-${{ github.sha }}
          name: Auto Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/tycho-terminal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
