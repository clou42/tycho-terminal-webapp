name: Build & Release App ZIP
on:
  push:
    branches: [ main ]
    paths:
      - 'app.js'
      - 'package.json'
      - '.github/workflows/release-zip.yml'
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP_DIR: "."        # set to subfolder if needed, e.g. "tycho-terminal-webapp"
      NODE_VERSION: "22"
      NPM_FLAGS: "--omit=dev"

    steps:
      - uses: actions/checkout@v4

      # Setup Node with cache ONLY if a lockfile exists
      - name: Setup Node (with cache)
        if: hashFiles(format('{0}/package-lock.json', env.APP_DIR)) != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      # Fallback when no lockfile -> no cache input (avoids the error)
      - name: Setup Node (no cache)
        if: hashFiles(format('{0}/package-lock.json', env.APP_DIR)) == ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Install deps: prefer npm ci when lockfile exists; otherwise npm install
      - name: Install production deps (npm ci)
        if: hashFiles(format('{0}/package-lock.json', env.APP_DIR)) != ''
        working-directory: ${{ env.APP_DIR }}
        run: npm ci $NPM_FLAGS

      - name: Install production deps (npm install)
        if: hashFiles(format('{0}/package-lock.json', env.APP_DIR)) == ''
        working-directory: ${{ env.APP_DIR }}
        run: npm install $NPM_FLAGS

      - name: Build flat ZIP (include node_modules)
        run: |
          cd "$APP_DIR"
          # Zip the *contents* so files are at ZIP root (no parent directory)
          zip -r ../tycho-terminal.zip . -x "**/.git*" "**/.github/**"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mv ../tycho-terminal.zip "$GITHUB_WORKSPACE/build/tycho-terminal.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_id }}-${{ github.sha }}
          name: Auto Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/tycho-terminal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
